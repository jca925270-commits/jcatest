<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ingresar — Sistema de Stock</title>
<script src="assets/js/theme-init.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: { orange: { DEFAULT: "#ff7a29", 600: "#ff7a29", 700: "#d9601a" } },
        fontFamily: {
          sans: ["Inter", "system-ui", "sans-serif"],
          mono: ["JetBrains Mono", "Consolas", "monospace"],
        },
      },
    },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
</head>
<body class="font-sans bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 min-h-screen">

<button id="btn-tema" onclick="alternarTema()"
  class="fixed top-4 right-4 text-xs font-medium px-3 py-1.5 rounded-full border border-slate-300 dark:border-slate-700 bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-300 hover:border-orange-500 hover:text-orange-600 dark:hover:text-orange-400 transition"></button>

<div class="min-h-screen flex items-center justify-center px-4"
     style="background: radial-gradient(circle at 30% 20%, rgba(255,122,41,.08), transparent 55%);">
  <div class="w-full max-w-sm bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-xl shadow-slate-900/5 dark:shadow-black/40 p-9">
    <h1 class="text-xl font-bold text-slate-900 dark:text-white">Sistema de Stock</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-6">Trazabilidad de dispositivo por MAC</p>

    <div id="msg-error" class="hidden mb-4 rounded-lg border border-red-300 dark:border-red-800 bg-red-50 dark:bg-red-950/40 text-red-700 dark:text-red-300 px-4 py-3 text-sm"></div>

    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Usuario</label>
        <input type="text" id="usuario" required autofocus placeholder="Nombre de usuario"
          class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Contraseña</label>
        <input type="password" id="password" required
          class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500">
      </div>
      <button type="submit" id="btn-submit"
        class="w-full bg-orange-600 hover:bg-orange-700 text-white font-semibold text-sm rounded-lg py-2.5 transition disabled:opacity-60">
        Ingresar
      </button>
    </form>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/theme.js"></script>
<script>
document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btn-submit");
  const msg = document.getElementById("msg-error");
  btn.disabled = true;
  btn.textContent = "Ingresando...";
  try {
    await apiFetch("auth.php", {
      method: "POST",
      params: { accion: "login" },
      body: {
        nombre: document.getElementById("usuario").value.trim(),
        password: document.getElementById("password").value,
      },
    });
    window.location.href = "index.html";
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.remove("hidden");
    btn.disabled = false;
    btn.textContent = "Ingresar";
  }
});
</script>
</body>
</html>
