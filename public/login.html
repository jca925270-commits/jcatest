<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" href="favicon.png">
<title>Ingresar — Sistema de Stock y Movmientos</title>
<script src="assets/js/theme-init.js?v=fijo"></script>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: { orange: { DEFAULT: "#ff7a29", 600: "#ff7a29", 700: "#d9601a" } },
        fontFamily: {
          sans: ["Inter", "system-ui", "sans-serif"],
          mono: ["JetBrains Mono", "Consolas", "monospace"],
        },
      },
    },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<link href="assets/css/banner.css?v=reloj1" rel="stylesheet">
</head>
<body class="font-sans min-h-screen">

<div class="login-hero min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-md">
    <img class="login-logo" src="assets/img/logo.png" alt="Banner Director">
    <p class="login-kicker">SOPORTE Y LOGISTICA</p>
    <h1>Ingresá al stock</h1>
    <p class="login-lead">dispositivos, depósitos y movimientos</p>

    <div class="login-card">

    <div id="msg-error" class="hidden mb-4 rounded-lg border border-red-300 dark:border-red-800 bg-red-50 dark:bg-red-950/40 text-red-700 dark:text-red-300 px-4 py-3 text-sm"></div>

    <form id="form-login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Usuario</label>
        <input type="text" id="usuario" required autofocus placeholder="Nombre de usuario"
          class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 dark:text-slate-300 mb-1">Contraseña</label>
        <input type="password" id="password" required
          class="w-full rounded-lg border border-slate-300 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-orange-500 focus:border-orange-500">
      </div>
      <button type="submit" id="btn-submit" class="login-submit">
        Ingresar →
      </button>
      <p class="text-center text-sm text-slate-500 dark:text-slate-300">Si no la recordás, el administrador te la cambia desde Usuarios.</p>
    </form>
    </div>
  </div>
</div>

<script src="assets/js/api.js?v=fuente"></script>
<script src="assets/js/theme.js"></script>
<script>
document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();
  const btn = document.getElementById("btn-submit");
  const msg = document.getElementById("msg-error");
  btn.disabled = true;
  btn.textContent = "Ingresando...";
  try {
    const data = await apiFetch("auth.php", {
      method: "POST",
      params: { accion: "login" },
      redirigir401: false,
      body: {
        nombre: document.getElementById("usuario").value.trim(),
        password: document.getElementById("password").value,
      },
    });
    if (!data) throw new Error("No se pudo ingresar.");
    window.location.href = "index.html";
  } catch (err) {
    msg.textContent = err.message;
    msg.classList.remove("hidden");
    btn.disabled = false;
    btn.textContent = "Ingresar →";
  }
});
</script>
</body>
</html>
