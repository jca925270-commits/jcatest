name: Sincronizar planilla

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: sync-planilla
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -r import/requirements.txt
      - name: Sincronizar con Aiven
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_SSL: "true"
          DB_SSL_CA: ${{ secrets.DB_SSL_CA }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GOOGLE_SHEET_MAC_ID: "1kzUJvelU8QDqThQkYHE2v2Anc0xW9avSTWQeCGWj_gY"
          GOOGLE_SHEET_SOPORTE_ID: "1b6zpjoQjgn6bkx6zCBZKgWDAjZ0cWG0x4OPEXJVvNHQ"
          GOOGLE_SHEET_TESTEO_ID: "16Ag2IJwMRHQSkrRIO8pC9ea4dxcSab6EC3TGKg0XmTI"
        run: python import/sync_planilla_drive.py --una-vez
